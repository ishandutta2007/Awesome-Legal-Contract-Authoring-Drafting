<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    .dynamic-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .dynamic-float1 {
      animation: float1 6s ease-in-out infinite alternate;
    }
    .dynamic-float2 {
      animation: float2 5s ease-in-out infinite alternate;
    }
    .dynamic-dash {
      stroke-dasharray: 6, 6;
      animation: dashMove 20s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.55; transform: scale(1.02); }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(7px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -120; }
    }
  </style>

  <!-- Background base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Dynamic ambient glowing orbs in deep background -->
  <g class="dynamic-pulse">
    <circle cx="150" cy="80" r="140" fill="#3b82f6" filter="url(#glow)" opacity="0.35" />
    <circle cx="1050" cy="260" r="150" fill="#8b5cf6" filter="url(#glow)" opacity="0.3" />
    <circle cx="650" cy="180" r="180" fill="#06b6d4" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- Dynamic flowing circuit/contract workflow line in background -->
  <path class="dynamic-dash" d="M 50,290 C 250,290 350,230 550,230 C 750,230 850,290 1150,290" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.35" />

  <!-- Floating UI pill elements in background (non-blocking) -->
  <g class="dynamic-float1" opacity="0.75" filter="url(#badgeShadow)">
    <rect x="70" y="35" width="220" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="88" cy="52" r="5" fill="#38bdf8" />
    <text x="102" y="57" class="badge-text" fill="#bae6fd">⚡ Smart Contract Logic</text>
  </g>

  <g class="dynamic-float2" opacity="0.75" filter="url(#badgeShadow)">
    <rect x="910" y="45" width="220" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="928" cy="62" r="5" fill="#a855f7" />
    <text x="942" y="67" class="badge-text" fill="#e9d5ff">🤖 AI Redlining &amp; Drafting</text>
  </g>

  <!-- Central Content (Foreground - completely clear and readable) -->
  <!-- Top Category Tag -->
  <g filter="url(#badgeShadow)">
    <rect x="440" y="38" width="320" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="600" y="59" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#60a5fa" text-anchor="middle" letter-spacing="1.5">⚖️ AWESOME LEGALTECH ECOSYSTEM</text>
  </g>

  <!-- Title -->
  <text x="600" y="125" class="title-text" text-anchor="middle" fill="url(#titleGrad)">
    Awesome Legal Contract Authoring &amp; Drafting
  </text>

  <!-- Subtitle -->
  <text x="600" y="162" class="subtitle-text" text-anchor="middle">
    Curated Hub of Open-Source Solutions, Enterprise CLM Suites &amp; AI-Powered Drafting Platforms
  </text>

  <!-- Feature interactive-looking showcase cards at bottom -->
  <g transform="translate(140, 205)">
    <!-- Card 1: Enterprise CLM -->
    <g transform="translate(0, 0)">
      <rect width="280" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#1e293b" />
      <text x="32" y="38" font-size="20" text-anchor="middle">🏢</text>
      <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Enterprise SaaS CLM</text>
      <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Ironclad • Icertis • Conga</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#38bdf8">Valuation &amp; Tier Pricing Audited →</text>
    </g>

    <!-- Card 2: AI Contract Intelligence -->
    <g transform="translate(320, 0)">
      <rect width="280" height="90" rx="12" fill="#0f172a" stroke="#4338ca" stroke-width="1.2" />
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#1e1b4b" />
      <text x="32" y="38" font-size="20" text-anchor="middle">🧠</text>
      <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">AI Drafting &amp; Copilots</text>
      <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Spellbook • Robin AI • Henchman</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#a78bfa">Redlining &amp; Auto-Playbooks →</text>
    </g>

    <!-- Card 3: Open-Source -->
    <g transform="translate(640, 0)">
      <rect width="280" height="90" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#064e3b" />
      <text x="32" y="38" font-size="20" text-anchor="middle">🔓</text>
      <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Open-Source &amp; Free</text>
      <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Docassemble • OpenContracts • Cicero</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#34d399">GitHub Star Badges Verified →</text>
    </g>
  </g>
</svg>
